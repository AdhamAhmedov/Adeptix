<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEPTIX — Tez orada</title>
<meta name="description" content="ADEPTIX — professional veb-saytlar va 360° virtual sayohatlar studiyasi. Yangi platformamiz tez orada ishga tushadi.">
<meta name="robots" content="noindex, follow">

<meta property="og:title" content="ADEPTIX — Tez orada">
<meta property="og:description" content="Professional veb-saytlar va 360° virtual sayohatlar studiyasi. Tez orada ishga tushamiz.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --purple: #6D4AFF;
    --purple-light: #A08CFF;
    --ink: #16181C;
    --paper: #F3F2F2;
    --line: rgba(243,242,242,0.14);
    --muted: rgba(243,242,242,0.6);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--ink);
    color: var(--paper);
    font-family: "Darker Grotesque", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100dvh;
    display:flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient backdrop: a single quiet gradient field, no motion beyond one slow drift */
  .field{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 55% at 78% 12%, rgba(160,140,255,0.16), transparent 60%),
      radial-gradient(45% 40% at 8% 92%, rgba(109,74,255,0.20), transparent 60%);
    animation: drift 24s ease-in-out infinite alternate;
  }

  @keyframes drift{
    from{ transform: translate3d(0,0,0); }
    to{ transform: translate3d(0, -1.5%, 0); }
  }

  .grid-lines{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 120px 120px;
    -webkit-mask-image: radial-gradient(75% 60% at 50% 40%, black, transparent 78%);
            mask-image: radial-gradient(75% 60% at 50% 40%, black, transparent 78%);
  }

  header{
    position: relative;
    z-index: 2;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 56px);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand svg{ width: 26px; height: 26px; display:block; }

  .wordmark{
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.01em;
  }

  .lang{
    font-size: 16px;
    color: var(--muted);
    font-weight: 600;
  }

  main{
    position: relative;
    z-index: 2;
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px clamp(20px, 6vw, 56px) 40px;
  }

  .content{
    width: 100%;
    max-width: 760px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    margin: 0;
    font-weight: 700;
    line-height: 0.98;
    font-size: clamp(40px, 7.5vw, 84px);
    letter-spacing: -0.01em;
  }

  .sub{
    margin: 18px 0 0;
    max-width: 46ch;
    font-size: clamp(18px, 2.1vw, 22px);
    line-height: 1.4;
    color: var(--muted);
    font-weight: 500;
  }

  .countdown{
    margin-top: clamp(40px, 6vw, 64px);
    display:flex;
    align-items: baseline;
    gap: clamp(10px, 2vw, 22px);
  }

  .unit{
    display:flex;
    flex-direction: column;
    align-items:center;
    min-width: clamp(78px, 12vw, 118px);
  }

  .unit span{
    font-weight: 800;
    font-size: clamp(56px, 11vw, 118px);
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--paper) 0%, var(--purple-light) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .unit label{
    margin-top: 6px;
    font-size: clamp(13px, 1.4vw, 15px);
    font-weight: 600;
    color: var(--muted);
  }

  .sep{
    font-weight: 700;
    font-size: clamp(36px, 7vw, 72px);
    color: var(--purple-light);
    transform: translateY(-10px);
  }

  .contact{
    margin-top: clamp(44px, 6vw, 64px);
    display:flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content:center;
  }

  .contact a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 12px 22px;
    border-radius: 999px;
    text-decoration:none;
    font-weight: 600;
    font-size: 17px;
    border: 1px solid var(--line);
    color: var(--paper);
    transition: border-color .2s ease, background-color .2s ease;
  }

  .contact a.primary{
    background: var(--purple);
    border-color: var(--purple);
  }

  .contact a.primary:hover{
    background: var(--purple-light);
    border-color: var(--purple-light);
    color: var(--ink);
  }

  .contact a:not(.primary):hover{
    border-color: var(--purple-light);
    background: rgba(160,140,255,0.08);
  }

  .stats{
    margin-top: 22px;
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content:center;
  }

  .stat{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .stat span span{ color: var(--paper); }

  .dot-live{
    width:7px; height:7px;
    border-radius:50%;
    background: #3ddc84;
    box-shadow: 0 0 8px #3ddc84;
    animation: livepulse 1.8s ease-in-out infinite;
  }

  @keyframes livepulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.7); }
  }

  footer{
    position: relative;
    z-index: 2;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: clamp(20px, 4vw, 32px) clamp(20px, 5vw, 56px);
    border-top: 1px solid var(--line);
  }

  .copyright{
    font-size: 15px;
    color: var(--muted);
    font-weight: 500;
  }

  .socials{
    display:flex;
    gap: 18px;
  }

  .socials a{
    color: var(--muted);
    display:flex;
    transition: color .2s ease;
  }

  .socials a:hover{ color: var(--paper); }

  .socials svg{ width: 20px; height: 20px; }

  @media (prefers-reduced-motion: reduce){
    .field{ animation: none; }
    .dot-live{ animation: none; }
  }
</style>
</head>
<body>

<div class="field" aria-hidden="true"></div>
<div class="grid-lines" aria-hidden="true"></div>

<header>
  <div class="brand">
    <svg viewBox="0 0 120 120" fill="#F3F2F2" aria-hidden="true">
      <path d="M20 16 L110 16 L94 40 L4 40 Z"></path>
      <path d="M20 50 L86 50 L70 74 L4 74 Z"></path>
      <path d="M20 84 L62 84 L46 108 L4 108 Z"></path>
    </svg>
    <span class="wordmark">ADEPTIX</span>
  </div>
  <span class="lang">UZ</span>
</header>

<main>
  <div class="content">
    <h1>Yangi sayt tez orada ishga tushadi.</h1>
    <p class="sub">Professional veb-saytlar va 360° virtual sayohatlar bo‘yicha ADEPTIX platformasi yangilanmoqda.</p>

    <div class="countdown" role="timer" aria-live="polite" aria-label="Ishga tushishga qolgan vaqt">
      <div class="unit">
        <span id="hh">24</span>
        <label>Soat</label>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span id="mm">00</span>
        <label>Daqiqa</label>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span id="ss">00</span>
        <label>Soniya</label>
      </div>
    </div>

    <div class="contact">
      <a class="primary" href="https://t.me/adeptix_admin" target="_blank" rel="noopener">Telegram orqali bog‘lanish</a>
      <a href="mailto:admin@adeptix.uz">admin@adeptix.uz</a>
    </div>

    <div class="stats" id="stats" hidden>
      <div class="stat" id="onlineStat">
        <span class="dot-live" aria-hidden="true"></span>
        <span><span id="onlineCount">0</span> kishi hozir sahifada</span>
      </div>
      <div class="stat" id="visitsStat">
        <span><span id="totalVisits">0</span> marta ko‘rilgan</span>
      </div>
    </div>
  </div>
</main>

<footer>
  <span class="copyright">© ADEPTIX. Barcha huquqlar himoyalangan.</span>
  <div class="socials">
    <a href="https://www.instagram.com/adeptix_uz/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1"></circle></svg>
    </a>
    <a href="https://t.me/adeptix_uz" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 4.5 3 11l6 2.2M21 4.5 15.5 20l-6.5-6.8M21 4.5 9 13.2"></path></svg>
    </a>
    <a href="https://www.youtube.com/@adeptix_uz" target="_blank" rel="noopener" aria-label="YouTube">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="M11 9.8 15 12l-4 2.2z" fill="currentColor" stroke="none"></path></svg>
    </a>
  </div>
</footer>

<script>
  // Fixed 24-hour launch target, set once so every visitor counts down to the same moment.
  var LAUNCH_AT = new Date("2026-09-05T13:07:26Z").getTime();

  var hhEl = document.getElementById('hh');
  var mmEl = document.getElementById('mm');
  var ssEl = document.getElementById('ss');

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    var diff = LAUNCH_AT - Date.now();
    if (diff <= 0){
      hhEl.textContent = '00';
      mmEl.textContent = '00';
      ssEl.textContent = '00';
      clearInterval(timer);
      return;
    }
    var totalSeconds = Math.floor(diff / 1000);
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    hhEl.textContent = pad(h);
    mmEl.textContent = pad(m);
    ssEl.textContent = pad(s);
  }

  tick();
  var timer = setInterval(tick, 1000);

  // Live "online now" + total visit count.
  // Real counters via Abacus (abacus.jasoncameron.dev) — a free, public, no-signup
  // counting service. Nothing is fabricated: if the service can't be reached
  // (network, ad-blocker, offline), the whole stats row stays hidden rather
  // than showing a made-up number.
  (function(){
    var API = 'https://abacus.jasoncameron.dev';
    var NS = 'adeptix.uz';
    var statsEl = document.getElementById('stats');
    var onlineEl = document.getElementById('onlineCount');
    var totalEl = document.getElementById('totalVisits');
    var joined = 0, left = 0, ready = false;

    function fmt(n){
      try { return n.toLocaleString('uz-UZ'); } catch(e){ return String(n); }
    }

    function renderOnline(){
      var now = Math.max(1, joined - left);
      onlineEl.textContent = fmt(now);
    }

    function safeJson(res){
      if (!res.ok) throw new Error('bad status');
      return res.json();
    }

    // Total pageviews: increments once per load, real cumulative count.
    fetch(API + '/hit/' + NS + '/total_visits')
      .then(safeJson)
      .then(function(d){
        totalEl.textContent = fmt(d.value);
        statsEl.hidden = false;
      })
      .catch(function(){ /* leave stats hidden if this fails */ });

    // "Online now": two plain counters (joined / left). Online = joined - left.
    // Not a perfect live presence system, but every number in it is real.
    function join(){
      return fetch(API + '/hit/' + NS + '/online_joined', { keepalive: true })
        .then(safeJson)
        .then(function(d){ joined = d.value; if (ready) renderOnline(); });
    }

    function leave(){
      fetch(API + '/hit/' + NS + '/online_left', { keepalive: true }).catch(function(){});
    }

    Promise.all([
      join(),
      fetch(API + '/get/' + NS + '/online_left').then(function(res){
        return res.ok ? res.json() : { value: 0 };
      }).then(function(d){ left = d.value || 0; }).catch(function(){ left = 0; })
    ]).then(function(){
      ready = true;
      renderOnline();
      statsEl.hidden = false;
    }).catch(function(){ /* leave stats hidden if this fails */ });

    function refresh(){
      Promise.all([
        fetch(API + '/get/' + NS + '/online_joined').then(safeJson).catch(function(){ return null; }),
        fetch(API + '/get/' + NS + '/online_left').then(function(res){
          return res.ok ? res.json() : null;
        }).catch(function(){ return null; })
      ]).then(function(results){
        if (results[0]) joined = results[0].value;
        if (results[1]) left = results[1].value;
        if (ready) renderOnline();
      });
    }
    setInterval(refresh, 20000);

    window.addEventListener('pagehide', leave);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') {
        leave();
      } else if (document.visibilityState === 'visible' && ready) {
        join();
      }
    });
  })();
</script>

</body>
</html>
